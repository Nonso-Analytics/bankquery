[project]
name = "bankquery"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Chinonso Okonkwo", email = "mosesthera@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dlt[duckdb]>=1.30.0",
    "lxml>=6.1.2",
    "minsearch>=0.2.0",
    "openai>=3.7.0",
    "pandas>=3.0.5",
    "playwright>=1.62.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "tqdm>=4.70.0",
]

[project.scripts]
bankquery = "bankquery:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
